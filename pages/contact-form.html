<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/contact-form.css">
</head>
<body>
    <header>
        <nav>
            <h1>Carlos Mario Rendón</h1>
            <div class="menu-icon">
                <i class="fas fa-bars"></i>
            </div>
            <ul>
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/pages/about-me.html">Sobre mí</a></li>
                <li><a href="/pages/portafolio.html">Portafolio</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="contact-form">
            <h2>Animate</h2>
            <p>Dejame un mensaje y crearemos algo increíble.</p>
            <form>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" placeholder="Escribe tu correo">

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje"></textarea>

                <button type="submit">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Carlos Mario Rendón</p>
        <ul>
            <li><a href="/pages/about-me.html">Sobre mí</a></li>
            <li><a href="/pages/portafolio.html">Portafolio</a></li>
        </ul>
        <div class="social-media">
            <a href="https://www.linkedin.com/in/carlos-mario-rendon/"><img src="/assets/img/linkedin.png" alt="LinkedIn"></a>
            <a href="#"><img src="/assets/img/github-clipart.png" alt="GitHub"></a>
        </div>
    </footer>

    <script src="/assets/js/contact-form.js"></script>
</body>
</html>
